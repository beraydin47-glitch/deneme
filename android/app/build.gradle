plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beraydin.sesdegistirici'
    compileSdk 35

    defaultConfig {
        applicationId 'com.beraydin.sesdegistirici'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Sabit anahtar: yeni surumler eskisinin uzerine kaldirmadan kurulabilsin diye
        sabit {
            storeFile file('ses.keystore')
            storePassword 'sesdegistirici'
            keyAlias 'ses'
            keyPassword 'sesdegistirici'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sabit
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
